<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ledgerly — Expense Manager</title>
  <meta name="description" content="Ledgerly — track expenses, capture receipts, set budgets and export tax-ready reports. Beautifully simple expense management for your business." />
  <meta name="theme-color" content="#F4F6F8" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../icons/icon-192.png" />
  <link rel="stylesheet" href="../assets/css/app.css" />
  <style>
    #splash { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 999; }
    #splash .b { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    #splash .lg { width: 52px; height: 52px; border-radius: 12px; background: #2563EB; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 24px; box-shadow: 0 6px 18px rgba(37,99,235,.28); animation: pop .5s cubic-bezier(.2,.7,.3,1); }
    @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  </style>
</head>
<body>
  <div id="splash"><div class="b"><div class="lg">L</div><div class="spinner"></div></div></div>
  <div id="app-root"></div>

  <script src="../assets/js/util.js"></script>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/db.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/billing.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/modals.js"></script>
  <script src="../assets/js/views.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
